name: Bug report
description: Report a reproducible problem with Legacy Clicker
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include passwords, tokens, or private information.

  - type: input
    id: version
    attributes:
      label: Legacy Clicker version
      placeholder: "Example: 0.1 Alpha"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Example: Windows 11 24H2"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe what happened.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Legacy Clicker
        2. Change ...
        3. Press ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I downloaded Legacy Clicker from this repository.
          required: true
        - label: I checked existing issues for the same problem.
          required: true
