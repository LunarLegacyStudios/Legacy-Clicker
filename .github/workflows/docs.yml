name: Documentation checks

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/docs.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate documentation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check required files
        shell: bash
        run: |
          Required_Files=(README.md CHANGELOG.md CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md LICENSE)
          for File in "${Required_Files[@]}"; do
            if [[ ! -s "$File" ]]; then
              echo "::error file=$File::Required file is missing or empty"
              exit 1
            fi
          done

      - name: Check trailing whitespace
        shell: bash
        run: |
          if grep -RInE "[[:blank:]]+$" --include="*.md" .; then
            echo "::error::Markdown files contain trailing whitespace"
            exit 1
          fi

      - name: Check local Markdown links
        shell: python
        run: |
          from pathlib import Path
          import re
          import sys

          Failed = False
          Pattern = re.compile(r"!?\[[^\]]*\]\(([^)]+)\)")

          for Markdown_File in Path(".").rglob("*.md"):
              Text = Markdown_File.read_text(encoding="utf-8")
              for Target in Pattern.findall(Text):
                  Target = Target.strip().split("#", 1)[0]
                  if not Target or "://" in Target or Target.startswith(("mailto:", "#")):
                      continue
                  Resolved = (Markdown_File.parent / Target).resolve()
                  if not Resolved.exists():
                      print(f"::error file={Markdown_File}::Broken local link: {Target}")
                      Failed = True

          sys.exit(1 if Failed else 0)
