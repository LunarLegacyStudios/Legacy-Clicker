name: Release readiness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/release-readiness.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Verify release documentation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate changelog structure
        shell: bash
        run: |
          grep -q "^## Unreleased" CHANGELOG.md
          grep -q "^## 0.1 Alpha - 2026-07-28" CHANGELOG.md

      - name: Validate download guidance
        shell: bash
        run: |
          grep -q "releases page" README.md
          grep -q "unsigned" README.md
          grep -q "Antivirus false positives" README.md

      - name: Summarize readiness
        shell: bash
        run: |
          {
            echo "## Release readiness"
            echo ""
            echo "- Required project files: present"
            echo "- Changelog structure: valid"
            echo "- Download guidance: present"
            echo "- Unsigned-build warning: present"
          } >> "$GITHUB_STEP_SUMMARY"
